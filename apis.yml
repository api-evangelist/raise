name: Raise
description: >-
  Raise is a digital gift card marketplace and commerce platform. Raise for
  Business exposes the Raise Commerce API — a REST/JSON API that lets partners
  programmatically browse a catalog of retailer gift card brands, purchase fixed-
  and variable-load gift cards, check and manage card balances, and reconcile
  transactions and commissions across 180+ currencies and many countries.
  Authentication is OAuth 2.0 bearer tokens (server-to-server client credentials,
  plus app/web auth with SR25519/RSA key pairs, SMS, or TOTP). The API uses a
  JSON:API-style data envelope, page-based pagination, request metadata, and
  client_order_id idempotency. Prior investors include Accel, PayPal, and NEA.
